[pytest]
; valley/·views/를 PYTHONPATH 설정 없이 import할 수 있게 한다 (pytest 7+ rootdir 기준 상대경로).
pythonpath = .
testpaths = tests
; ⚠️ network 마커 테스트는 기본 실행에서 제외한다 — 실제 yfinance/FRED/ECOS/DART/EDGAR/KRX를
; 호출해 느리고(수십 초) 네트워크·크레덴셜(KRX_ID/KRX_PW 등)에 좌우된다. 전체를 포함해
; 돌리려면 `pytest -m network` 또는 `pytest -m ""`(마커 필터 해제)를 쓴다.
addopts = -m "not network" --strict-markers
markers =
    network: 실제 외부 API를 호출하는 느린 통합 테스트 (기본 실행에서 제외됨)
